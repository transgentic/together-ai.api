name: Publish recipe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release.py
